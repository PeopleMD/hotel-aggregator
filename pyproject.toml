[project]
name = "hotel-aggregator"
version = "0.1.0"
description = "Collects hotels from several sources, deduplicates them and serves them over an API"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.28",
    "lxml>=5.3",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "rapidfuzz>=3.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aggregator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"demo_supplier/*" = ["S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
packages = ["aggregator"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
